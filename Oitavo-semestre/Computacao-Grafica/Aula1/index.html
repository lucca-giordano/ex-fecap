<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div>
        <canvas
            id="canvas" 
            width="400" 
            height="400">
        </canvas>
    </div>

    <div>
        <p>Velocidade: <span id="speedValue">0.02</span></p>
        <input
            type="range"
            id="speed"
            min="0.001"
            max="0.1"
            step="0.001"
            value="0.02">


        <br>

        <p>Distância: <span id="distanceValue">150</span></p>
        <input
            type="range"
            id="distance"
            min="10"
            max="200"
            step="1"
            value="150">

    </div>



    <script src="script.js" type="module"></script>
</body>
</html>
