<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu (debug)</title>
  <style>
    html, body { margin: 0; background: #222; color: #ddd; font: 12px monospace; }
    #bar { padding: 12px 16px; display: flex; gap: 16px; align-items: center; }
    .grid { display: flex; flex-wrap: wrap; gap: 16px; padding: 0 16px 16px; }
    figure { margin: 0; text-align: center; }
    /* Fundo xadrez: mostra onde o menu é transparente (lá aparece a cena). */
    canvas {
      display: block; image-rendering: pixelated;
      background: repeating-conic-gradient(#333 0% 25%, #444 0% 50%) 0 0 / 24px 24px;
    }
    figcaption { margin-top: 4px; }
    #msg { color: #f44; padding: 16px; font-size: 16px; }
  </style>
</head>
<body>
  <div id="bar">
    <span>Caveira:</span>
    <label><input type="radio" name="skull" value="0" checked> M_SKULL1</label>
    <label><input type="radio" name="skull" value="1"> M_SKULL2</label>
    <span>Idioma:</span>
    <label><input type="radio" name="lang" value="en" checked> en</label>
    <label><input type="radio" name="lang" value="pt"> pt</label>
  </div>
  <div id="msg"></div>
  <div class="grid" id="screens"></div>
  <script type="module" src="menu.js"></script>
</body>
</html>
