<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HUD e pistola (debug)</title>
  <style>
    html, body { margin: 0; background: #222; color: #ddd; font: 12px monospace; }
    h2 { margin: 16px 16px 8px; font-size: 14px; }
    .grid { display: flex; flex-wrap: wrap; gap: 16px; padding: 0 16px 16px; align-items: flex-end; }
    figure { margin: 0; text-align: center; }
    canvas { display: block; image-rendering: pixelated; }
    figcaption { margin-top: 4px; }
    #msg { color: #f44; padding: 16px; font-size: 16px; }
    h3 { margin: 12px 16px 4px; font-size: 13px; }
    .missing { color: #f44; border: 1px solid #f44; padding: 12px; }
  </style>
</head>
<body>
  <div id="msg"></div>
  <h2>Camada composta de cada arma (fundo cinza; linha magenta em y = 168)</h2>
  <div class="grid" id="layers"></div>
  <h2>Barra: vida, munição e armadura</h2>
  <div class="grid" id="bars"></div>
  <h2>Quadros de cada arma e clarão (cruz na origem leftOffset, topOffset; ausentes em vermelho)</h2>
  <div class="grid" id="frames"></div>
  <script type="module" src="hud.js"></script>
</body>
</html>
