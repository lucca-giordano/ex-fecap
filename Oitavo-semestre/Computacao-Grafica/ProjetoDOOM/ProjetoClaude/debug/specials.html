<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Especiais e setores móveis (debug)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 12px monospace; overflow: hidden; }
    #wrap { display: flex; height: 100%; }
    canvas { flex: 1; display: block; min-width: 0; cursor: pointer; }
    #side { width: 420px; padding: 8px; overflow-y: auto; border-left: 1px solid #333; }
    #side button, #side select { font: 12px monospace; margin: 2px 0; }
    table { border-collapse: collapse; margin: 6px 0; width: 100%; }
    td, th { border: 1px solid #333; padding: 2px 4px; text-align: left; vertical-align: top; }
    th { color: #9c9; }
    .no { color: #f66; }
    #selected, #thinkers, #warnings, #log { white-space: pre-wrap; margin: 6px 0; }
    #warnings { color: #fc6; }
    .legend span { display: inline-block; width: 14px; height: 4px; margin: 0 4px 2px 8px; vertical-align: middle; }
    #msg { color: #f44; padding: 8px; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="map"></canvas>
    <div id="side">
      <div id="msg"></div>
      <div class="legend">
        <span style="background:#4cf"></span>porta manual<span style="background:#36f"></span>chave azul<span style="background:#ff4"></span>amarela<span style="background:#f44"></span>vermelha<br>
        <span style="background:#f8f"></span>interruptor<span style="background:#4f4"></span>cruzamento<span style="background:#fff"></span>saída<span style="background:#f80"></span>não suportado
      </div>
      <div>
        <button id="play">Play</button>
        <button id="step">+1 tic</button>
        <select id="speed"><option value="1">1x</option><option value="4">4x</option><option value="16">16x</option></select>
        <button id="reset">Reiniciar</button>
      </div>
      <p>Clique numa linha para selecionar; depois simule o uso ou o cruzamento.</p>
      <div id="selected">nenhuma linha selecionada</div>
      <button id="use">Usar (E)</button>
      <button id="cross">Cruzar</button>
      <label><input id="keys" type="checkbox" checked> com todas as chaves</label>
      <div id="log"></div>
      <b>Thinkers ativos</b>
      <div id="thinkers"></div>
      <b>Especiais do mapa</b>
      <table id="hist"></table>
      <b>Avisos</b>
      <div id="warnings"></div>
    </div>
  </div>
  <script type="module" src="specials.js"></script>
</body>
</html>
