<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monstros e efeitos (debug)</title>
  <style>
    html, body { margin: 0; background: #222; color: #ddd; font: 12px monospace; }
    h2 { margin: 16px 16px 4px; font-size: 14px; }
    .type { padding: 6px 16px; border-top: 1px solid #333; }
    .state { margin: 4px 0; }
    .frames { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
    figure { margin: 0; text-align: center; }
    canvas { display: block; image-rendering: pixelated; background: #333; }
    .missing { color: #f44; border: 1px solid #f44; padding: 12px; }
    #msg { color: #f44; padding: 16px; font-size: 16px; }
    #summary { padding: 0 16px; color: #9c9; }
  </style>
</head>
<body>
  <div id="msg"></div>
  <h2>Monstros e efeitos do E1M1</h2>
  <div id="summary"></div>
  <div id="types"></div>
  <script type="module" src="monsters.js"></script>
</body>
</html>
