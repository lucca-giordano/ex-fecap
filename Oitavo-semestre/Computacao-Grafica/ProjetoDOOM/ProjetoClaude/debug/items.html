<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Itens e sólidos (debug)</title>
  <style>
    html, body { margin: 0; background: #222; color: #ddd; font: 12px monospace; }
    h2 { margin: 16px 16px 4px; font-size: 14px; }
    .grid { display: flex; flex-wrap: wrap; gap: 12px; padding: 0 16px 8px; align-items: flex-end; }
    figure { margin: 0; text-align: center; max-width: 220px; }
    canvas { display: block; margin: 0 auto; image-rendering: pixelated; background: #333; }
    .missing { color: #f44; border: 1px solid #f44; padding: 12px; max-width: 200px; white-space: pre-line; }
    table { margin: 0 16px 16px; border-collapse: collapse; }
    td, th { border: 1px solid #444; padding: 2px 8px; text-align: right; }
    th { color: #9c9; }
    #msg { color: #f44; padding: 16px; font-size: 16px; }
  </style>
</head>
<body>
  <div id="msg"></div>
  <h2>Itens coletáveis (todos os tipos da tabela; contagem no E1M1 depois do filtro de dificuldade)</h2>
  <div class="grid" id="items"></div>
  <h2>Objetos sólidos (decoração fixa, raio da caixa)</h2>
  <div class="grid" id="solids"></div>
  <h2>Totais do E1M1</h2>
  <table id="totals"></table>
  <script type="module" src="items.js"></script>
</body>
</html>
