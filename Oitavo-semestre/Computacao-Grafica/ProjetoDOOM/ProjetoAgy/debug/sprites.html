<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depuração de Sprites 2D - Freedoom E1M1</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #ffca28;
            margin-top: 0;
        }
        #stats-bar {
            background: #2a2a2a;
            border-left: 4px solid #ffca28;
            padding: 12px 16px;
            margin-bottom: 24px;
            font-size: 14px;
            line-height: 1.6;
        }
        .filter-controls {
            margin-bottom: 20px;
        }
        .filter-btn {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 6px 12px;
            cursor: pointer;
            margin-right: 8px;
            border-radius: 4px;
        }
        .filter-btn.active {
            background: #ffca28;
            color: #000;
            font-weight: bold;
        }
        .sprite-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .sprite-card {
            background: #222;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .sprite-card.unresolved {
            border-color: #f44336;
            background: #2c1a1a;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .card-title {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }
        .card-title .type-badge {
            background: #444;
            color: #ffca28;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 14px;
            margin-left: 8px;
        }
        .card-meta {
            font-size: 13px;
            color: #aaa;
        }
        .views-row {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 8px 0;
            align-items: flex-end;
        }
        .view-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #111;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #333;
        }
        .view-label {
            font-size: 12px;
            color: #888;
            margin-top: 6px;
            text-align: center;
        }
        .view-lump-name {
            font-size: 10px;
            color: #00bcd4;
            margin-top: 2px;
        }
        .canvas-container {
            position: relative;
            background-image: 
                linear-gradient(45deg, #181818 25%, transparent 25%), 
                linear-gradient(-45deg, #181818 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #181818 75%), 
                linear-gradient(-45deg, transparent 75%, #181818 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
            border: 1px solid #444;
            display: inline-block;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
        }
        .legend {
            margin-top: 8px;
            font-size: 12px;
            color: #aaa;
        }
        .legend span {
            display: inline-block;
            margin-right: 15px;
        }
        .cross-legend {
            color: #00ffff;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Depuração de Sprites 2D - Freedoom E1M1</h1>
    <div id="stats-bar">Carregando dados do WAD e compilando registro de sprites...</div>

    <div class="legend">
        <span><strong class="cross-legend">+ Cruz Ciano:</strong> Origem do sprite (leftOffset, topOffset)</span>
        <span><strong>Escala:</strong> 3x ampliado</span>
        <span><strong>Filtro:</strong> Dificuldade SKILL = 3 (single-player)</span>
    </div>

    <div id="content" class="sprite-list" style="margin-top: 16px;"></div>

    <script type="module" src="sprites.js"></script>
</body>
</html>
